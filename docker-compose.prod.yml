name: konji-shop-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

services:
  app:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: app-production
    image: ${APP_IMAGE:-konji-shop-app:prod}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      HOME: /tmp
      # The deploy script owns bootstrap/cache for the app container.
      # Avoid racing its cache refresh from docker/entrypoint.sh.
      LARAVEL_CACHE_ON_BOOT: "false"
    depends_on:
      redis:
        condition: service_started
    networks:
      - konji
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${WEB_IMAGE:-konji-shop-web:prod}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - konji
    volumes:
      - app_storage:/var/www/html/storage
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    command: sh -c "ln -sfn /var/www/html/storage/app/public /var/www/html/public/storage && nginx -g 'daemon off;'"

  queue:
    logging: *default-logging
    image: ${APP_IMAGE:-konji-shop-app:prod}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      HOME: /tmp
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120 --max-time=3600 --max-jobs=1000 --memory=256
    networks:
      - konji
    volumes:
      - app_storage:/var/www/html/storage

  scheduler:
    logging: *default-logging
    image: ${APP_IMAGE:-konji-shop-app:prod}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      HOME: /tmp
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    command: php artisan schedule:work --no-interaction
    networks:
      - konji
    volumes:
      - app_storage:/var/www/html/storage

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru
    networks:
      - konji
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_storage:
  redis_data:

networks:
  konji:
    driver: bridge
