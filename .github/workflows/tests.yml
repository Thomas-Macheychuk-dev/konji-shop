name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Validate Catalogue View Sync
        run: |
          bash -n scripts/deploy/sync-catalogue-views-20261030.sh
          python3 tests/Fixtures/Deployment/test-catalogue-view-sync.py
          bash -n scripts/deploy/sync-product-page-cache-20261030.sh
          python3 tests/Fixtures/Deployment/test-product-page-cache-patch.py
          bash -n scripts/deploy/sync-seo-content-20261031.sh
          python3 tests/Fixtures/Deployment/test-seo-content-patch.py
          bash -n scripts/deploy/sync-reviewed-seo-20261031.sh
          python3 tests/Fixtures/Deployment/test-reviewed-seo-patch.py
          bash -n scripts/deploy/sync-product-seo-database-20261031.sh
          bash -n scripts/seo/product-database-20261031/repair.sh
          python3 tests/Fixtures/Deployment/test-product-seo-database-patch.py
          python3 scripts/seo/editorial-review-20261031/test_download.py
          bash -n scripts/seo/editorial-repair-20261031/repair.sh
          python3 scripts/seo/editorial-repair-20261031/test_content.py
          bash -n scripts/seo/editorial-followup-20261031/repair.sh
          python3 scripts/seo/editorial-followup-20261031/test_content.py
          bash -n scripts/seo/manufacturer-review-20261101/repair.sh
          python3 scripts/seo/manufacturer-review-20261101/test_content.py
          bash -n scripts/seo/colour-correction-20261101/repair.sh
          python3 scripts/seo/colour-correction-20261101/test_content.py
          bash -n scripts/seo/source-cleanup-20261101/repair.sh
          python3 scripts/seo/source-cleanup-20261101/test_content.py
          bash -n scripts/seo/evidence-followup-20261101/repair.sh
          python3 scripts/seo/evidence-followup-20261101/test_content.py
          bash -n scripts/seo/duplicate-codes-20261101/repair.sh
          python3 scripts/seo/duplicate-codes-20261101/test_content.py
          bash -n scripts/seo/variant-review-20261101/repair.sh
          python3 scripts/seo/variant-review-20261101/test_content.py
          bash -n scripts/seo/consolidation-20261101/repair.sh
          bash -n scripts/seo/consolidation-20261101/patch-runtime.sh
          python3 scripts/seo/consolidation-20261101/test_content.py
          bash -n scripts/seo/identity-review-20261101/repair.sh
          python3 scripts/seo/identity-review-20261101/test_content.py

      - name: Validate reviewed product identity repair
        run: ./vendor/bin/pest tests/Feature/Console/ProductSeoIdentityReviewTest.php

      - name: Run Tests
        run: ./vendor/bin/pest






