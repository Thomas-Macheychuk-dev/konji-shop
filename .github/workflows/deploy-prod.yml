name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Add Flux credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Guard SEO-03B production deployment
        id: seo03b_gate
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          BASE="7e009b879c9c6c22a55951d6319750e3a72bbc03"
          ORIGINAL="bebe59097adddcdedf811d87b65ba6339ab289939485279a246159f1ff645862"
          PROMOTED="ece3d1558b317f2e7517e0ac6397e18f936e55a2ae258c51ffd28ef7db10c196"
          MANIFEST="6a1ca8e5c7fa2df92148490634dabb0d648f6d1647d6cce4a6bc5c3da10e674d"

          MAP_PATH="docker/nginx/generated/legacy-seo-product-map.conf"
          MANIFEST_PATH="resources/seo/ortezka/review/seo-03b-p4-20261003/approved-58-manifest.json"

          current="$(sha256sum "$MAP_PATH" | awk '{print $1}')"

          if [[ "$current" == "$ORIGINAL" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$current" != "$PROMOTED" ]]; then
            echo "::error::Unexpected production redirect map checksum."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" ||
                "$GITHUB_REF" != "refs/heads/main" ||
                "${PUSH_BEFORE:-}" != "$BASE" ||
                "$GITHUB_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::SEO-03B deployment remains blocked pending release authorisation."
            exit 1
          fi

          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"

          original_sha="$(
            git show "$BASE:$MAP_PATH" | sha256sum | awk '{print $1}'
          )"

          [[ "$original_sha" == "$ORIGINAL" ]] || {
            echo "::error::Unexpected original map."
            exit 1
          }

          manifest_sha="$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')"

          [[ "$manifest_sha" == "$MANIFEST" ]] || {
            echo "::error::Frozen approval manifest mismatch."
            exit 1
          }

          expected_diff="$(printf '%s\n' \
            $'M\t.github/workflows/deploy-prod.yml' \
            $'M\tdocker/nginx/generated/legacy-seo-product-map.conf' \
            $'A\ttests/Feature/Seo/SeoLegacyProductRedirectPromotionTest.php' \
            $'M\ttests/Feature/Seo/SeoLegacyProductRedirectRuntimeTest.php')"

          actual_diff="$(git diff --name-status "$BASE" "$GITHUB_SHA")"

          if [[ "$actual_diff" != "$expected_diff" ]]; then
            echo "::error::Unexpected files in SEO-03B source promotion."
            printf '%s\n' "$actual_diff"
            exit 1
          fi

          git diff --check "$BASE" "$GITHUB_SHA"

          echo "deploy=false" >> "$GITHUB_OUTPUT"

          echo "### SEO-03B source-only promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests completed; production deployment intentionally withheld." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: steps.seo03b_gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: konji-shop-prod-${{ github.run_id }}
          allowed-account-ids: '628263975265'

      - name: Deploy over SSM
        if: steps.seo03b_gate.outputs.deploy == 'true'
        env:
          AWS_REGION: eu-central-1
          INSTANCE_ID: ${{ vars.AWS_PROD_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ -z "${INSTANCE_ID}" ]; then
            echo "::error::AWS_PROD_INSTANCE_ID is not configured for the production environment."
            exit 1
          fi

          REMOTE_COMMAND="sudo -u ubuntu sh -lc 'cd /var/www/konji-shop && git fetch origin main && git checkout main && git merge --ff-only ${DEPLOY_SHA} && env APP_PATH=/var/www/konji-shop BRANCH=main DEPLOY_SHA=${DEPLOY_SHA} ./scripts/deploy/aws-production.sh'"
          PARAMETERS="$(jq -cn --arg command "${REMOTE_COMMAND}" '{commands:[$command]}')"

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids "${INSTANCE_ID}"               --document-name AWS-RunShellScript               --comment "Deploy Konji production ${DEPLOY_SHA}"               --timeout-seconds 1800               --parameters "${PARAMETERS}"               --query 'Command.CommandId'               --output text
          )"

          echo "SSM command: ${COMMAND_ID}"

          FINAL_STATUS=""

          for ATTEMPT in $(seq 1 120); do
            INVOCATION="$(
              aws ssm get-command-invocation                 --command-id "${COMMAND_ID}"                 --instance-id "${INSTANCE_ID}"                 --output json                 2>/dev/null || true
            )"

            STATUS="$(jq -r '.Status // "Pending"' <<<"${INVOCATION}")"
            RESPONSE_CODE="$(jq -r '.ResponseCode // -1' <<<"${INVOCATION}")"

            echo "attempt=${ATTEMPT} status=${STATUS} response_code=${RESPONSE_CODE}"

            case "${STATUS}" in
              Success)
                jq -r '.StandardOutputContent // empty' <<<"${INVOCATION}"

                STDERR_OUTPUT="$(jq -r '.StandardErrorContent // empty' <<<"${INVOCATION}")"
                if [ -n "${STDERR_OUTPUT}" ]; then
                  printf '%s\n' "${STDERR_OUTPUT}" >&2
                fi

                FINAL_STATUS="Success"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                jq -r '.StandardOutputContent // empty' <<<"${INVOCATION}"
                jq -r '.StandardErrorContent // empty' <<<"${INVOCATION}" >&2
                FINAL_STATUS="${STATUS}"
                break
                ;;
            esac

            sleep 15
          done

          if [ "${FINAL_STATUS}" != "Success" ]; then
            if [ -z "${FINAL_STATUS}" ]; then
              echo "::error::SSM deployment did not reach a terminal state within 30 minutes."
            else
              echo "::error::SSM deployment finished with status ${FINAL_STATUS}."
            fi

            exit 1
          fi
