name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Add Flux credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: konji-shop-prod-${{ github.run_id }}
          allowed-account-ids: '628263975265'

      - name: Deploy over SSM
        env:
          AWS_REGION: eu-central-1
          INSTANCE_ID: ${{ vars.AWS_PROD_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ -z "${INSTANCE_ID}" ]; then
            echo "::error::AWS_PROD_INSTANCE_ID is not configured for the production environment."
            exit 1
          fi

          REMOTE_COMMAND="sudo -u ubuntu sh -lc 'cd /var/www/konji-shop && git fetch origin main && git checkout main && git merge --ff-only ${DEPLOY_SHA} && env APP_PATH=/var/www/konji-shop BRANCH=main DEPLOY_SHA=${DEPLOY_SHA} ./scripts/deploy/aws-production.sh'"
          PARAMETERS="$(jq -cn --arg command "${REMOTE_COMMAND}" '{commands:[$command]}')"

          COMMAND_ID="$(
            aws ssm send-command               --instance-ids "${INSTANCE_ID}"               --document-name AWS-RunShellScript               --comment "Deploy Konji production ${DEPLOY_SHA}"               --timeout-seconds 1800               --parameters "${PARAMETERS}"               --query 'Command.CommandId'               --output text
          )"

          echo "SSM command: ${COMMAND_ID}"

          FINAL_STATUS=""

          for ATTEMPT in $(seq 1 120); do
            INVOCATION="$(
              aws ssm get-command-invocation                 --command-id "${COMMAND_ID}"                 --instance-id "${INSTANCE_ID}"                 --output json                 2>/dev/null || true
            )"

            STATUS="$(jq -r '.Status // "Pending"' <<<"${INVOCATION}")"
            RESPONSE_CODE="$(jq -r '.ResponseCode // -1' <<<"${INVOCATION}")"

            echo "attempt=${ATTEMPT} status=${STATUS} response_code=${RESPONSE_CODE}"

            case "${STATUS}" in
              Success)
                jq -r '.StandardOutputContent // empty' <<<"${INVOCATION}"

                STDERR_OUTPUT="$(jq -r '.StandardErrorContent // empty' <<<"${INVOCATION}")"
                if [ -n "${STDERR_OUTPUT}" ]; then
                  printf '%s\n' "${STDERR_OUTPUT}" >&2
                fi

                FINAL_STATUS="Success"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                jq -r '.StandardOutputContent // empty' <<<"${INVOCATION}"
                jq -r '.StandardErrorContent // empty' <<<"${INVOCATION}" >&2
                FINAL_STATUS="${STATUS}"
                break
                ;;
            esac

            sleep 15
          done

          if [ "${FINAL_STATUS}" != "Success" ]; then
            if [ -z "${FINAL_STATUS}" ]; then
              echo "::error::SSM deployment did not reach a terminal state within 30 minutes."
            else
              echo "::error::SSM deployment finished with status ${FINAL_STATUS}."
            fi

            exit 1
          fi
