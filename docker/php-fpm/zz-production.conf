[www]
; Low-idle-memory baseline for the single-host MVP. New workers are created on
; demand and recycled periodically to bound long-running process growth.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Keep individual web requests bounded while leaving CLI import commands free to
; use the container-wide PHP memory limit when explicitly run by an operator.
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 256M

; Docker supplies application configuration through environment variables.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
