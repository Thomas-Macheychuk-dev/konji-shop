# Included inside both HTTP and HTTPS server blocks, after the exact product
# redirects, only when LEGACY_SEO_FALLBACK_REDIRECTS_ENABLED=true/1/on/yes.
if ($legacy_seo_fallback_target = "410") {
    return 410;
}
if ($legacy_seo_fallback_target != "") {
    return 301 $legacy_seo_redirect_origin$legacy_seo_fallback_target;
}
# Exact paths above win; these catch legacy aliases and /index.php query strings by legacy ID.
if ($legacy_seo_product_id_target != "") {
    return 301 $legacy_seo_redirect_origin$legacy_seo_product_id_target;
}
if ($legacy_seo_category_id_target = "410") {
    return 410;
}
if ($legacy_seo_category_id_target != "") {
    return 301 $legacy_seo_redirect_origin$legacy_seo_category_id_target;
}
if ($legacy_seo_index_php != "") {
    return 301 $legacy_seo_redirect_origin$legacy_seo_index_php;
}
