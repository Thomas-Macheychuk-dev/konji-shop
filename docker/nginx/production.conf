limit_req_zone $binary_remote_addr zone=konji_storefront:10m rate=15r/s;

map $request_method $konji_mutation_limit_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}

limit_req_zone $konji_mutation_limit_key zone=konji_mutations:10m rate=3r/s;

sendfile on;
tcp_nopush on;
keepalive_timeout 30s;
keepalive_requests 1000;
open_file_cache max=2000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors off;

# Keep port 80 available for Let's Encrypt HTTP-01 renewals. All ordinary
# traffic is redirected to the canonical HTTPS staging hostname.
server {
    listen 80;
    server_name staging.ortezka.pl;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://staging.ortezka.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.ortezka.pl;

    ssl_certificate /etc/letsencrypt/live/staging.ortezka.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ortezka.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 32M;
    server_tokens off;

    limit_req_status 429;
    limit_req_log_level warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; }

    # These endpoints must stay available to infrastructure or trusted
    # server-to-server integrations and therefore bypass request throttles.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    location = /payments/paynow/notifications {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|webp|avif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        limit_req zone=konji_storefront burst=40 nodelay;
        limit_req zone=konji_mutations burst=10 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_keep_conn on;
        fastcgi_connect_timeout 5s;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_read_timeout 120s;
    }
}
