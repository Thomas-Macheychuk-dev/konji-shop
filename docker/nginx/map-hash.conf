# The governed legacy SEO redirect maps exceed Nginx's default map hash
# sizing once the production map reaches 400 entries; the legacy
# category fallback map adds about 14,600 more.
#
# This file is installed as 00-hash-tuning.conf so it is parsed before
# 00-legacy-seo-product-map.conf and 00-legacy-seo-staging-extra-map.conf.
map_hash_max_size 65536;
